<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Select NFL bets to track." />
    <title>NFL Bet Selection</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>NFL Bet Selection</h1>
        <div class="connection-status"><span class="status-dot"></span><span id="last-updated">Not loaded</span></div>
      </header>

      <section class="controls" aria-label="Odds filters">
        <label>
          <span>League</span>
          <select id="league-select">
            <option value="football/nfl">NFL</option>
          </select>
        </label>
        <label>
          <span>Week</span>
          <output class="week-display" id="week-range">Loading week...</output>
        </label>
        <button class="button button-primary" id="refresh-button" type="button">Refresh odds</button>
      </section>

      <section class="summary-row" aria-live="polite">
        <div><strong id="market-count">—</strong><span>available markets</span></div>
        <div><strong id="selected-count">0</strong><span>selected bets</span></div>
        <button class="clear-button" id="clear-button" type="button">Clear selection</button>
      </section>

      <div id="alert" class="alert" role="alert" hidden></div>

      <section class="games-list" id="bets-body" aria-label="Available bets">
        <div class="placeholder-row"><span class="loader"></span> Loading current markets...</div>
      </section>

      <section class="selected-section">
        <div class="section-heading">
          <div>
            <h2>Selected bets</h2>
          </div>
          <div class="parlay-total"><span>Parlay odds</span><strong id="parlay-odds">—</strong></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Game</th><th>Market</th><th>Pick</th><th>Odds</th><th class="remove-column">Action</th></tr>
            </thead>
            <tbody id="selected-body">
              <tr class="placeholder-row"><td colspan="5">No bets selected.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <footer class="action-bar">
        <span class="action-note">Saving to the local API is not enabled.</span>
        <button class="button button-save" id="save-button" type="button" disabled>Save selected bets</button>
      </footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
